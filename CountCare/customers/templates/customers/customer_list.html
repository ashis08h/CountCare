
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashCount | Customer Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    {% load static %}
    <link rel="stylesheet"
          href="{% static 'customers/css/customer.css' %}">
</head>

<body>
<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Customer Management</h2>
            <p class="text-muted mb-0">Manage your CashCount customers</p>
        </div>

        <div class="d-flex gap-2">

            <a href="/api/customer-import/"
               class="btn btn-outline-primary">
                Import Customers
            </a>
            <a href="/api/customer-import-history/"
               class="btn btn-outline-secondary">
                Import History
            </a>

            <button class="btn btn-primary"
                    data-bs-toggle="collapse"
                    data-bs-target="#customerFormSection">
                + Add Customer
            </button>

        </div>
    </div>

    <div id="messageBox"></div>

    <!-- Customer Registration Form -->
    <div class="collapse mb-4" id="customerFormSection">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">Customer Registration</h5>
            </div>

            <div class="card-body">
                <form id="customerForm">

                    <h6 class="mb-3">Customer Details</h6>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Customer Type *</label>
                            <select class="form-select" id="customerType" required>
                                <option value="INDIVIDUAL">Individual</option>
                                <option value="BUSINESS">Business</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3" id="businessNameGroup">
                            <label class="form-label">Business Name</label>
                            <input type="text" class="form-control"
                                   id="businessName">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Contact Person *</label>
                            <input type="text" class="form-control"
                                   id="contactPerson" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Mobile Number *</label>
                            <input type="text" class="form-control"
                                   id="mobileNumber" maxlength="13" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Alternate Mobile</label>
                            <input type="text" class="form-control"
                                   id="alternateMobile" maxlength="13">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   id="email">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">GST Number</label>
                            <input type="text" class="form-control"
                                   id="gstNumber" maxlength="15">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">PAN Number</label>
                            <input type="text" class="form-control"
                                   id="panNumber" maxlength="10">
                        </div>

                        <div class="col-md-12 mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" id="notes"
                                      rows="2"></textarea>
                        </div>
                    </div>

                    <hr>

                    <h6 class="mb-3">Billing Address</h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Address Line 1 *</label>
                            <input type="text" class="form-control"
                                   id="addressLine1" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Address Line 2</label>
                            <input type="text" class="form-control"
                                   id="addressLine2">
                        </div>

                        <div class="col-md-3 mb-3">
                            <label class="form-label">City *</label>
                            <input type="text" class="form-control"
                                   id="city" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label class="form-label">District</label>
                            <input type="text" class="form-control"
                                   id="district">
                        </div>

                        <div class="col-md-3 mb-3">
                            <label class="form-label">State *</label>
                            <input type="text" class="form-control"
                                   id="state" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label class="form-label">PIN Code *</label>
                            <input type="text" class="form-control"
                                   id="pincode" maxlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success"
                            id="saveCustomerBtn">
                        Save Customer
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        Clear
                    </button>

                </form>
            </div>
        </div>
    </div>

    <!-- Customer Listing -->
    <div class="card shadow-sm">
        <div class="card-header">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="mb-0">Customer List</h5>
                </div>

                <div class="col-md-6">
                    <div class="row g-2 align-items-center">

                        <div class="col-md-4">
                            <input type="text"
                                   id="searchCustomer"
                                   class="form-control"
                                   placeholder="Search by name, mobile, email or code">
                        </div>

                        <div class="col-md-2">
                            <select id="customerTypeFilter" class="form-select">
                                <option value="">All Types</option>
                                <option value="INDIVIDUAL">Individual</option>
                                <option value="BUSINESS">Business</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <select id="customerStatusFilter" class="form-select">
                                <option value="">All Statuses</option>
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <div class="dropdown">
                                <button class="btn btn-success dropdown-toggle w-100"
                                        type="button"
                                        data-bs-toggle="dropdown">
                                    Export Customers
                                </button>

                                <ul class="dropdown-menu dropdown-menu-end w-100">

                                    <li>
                                        <a class="dropdown-item" href="#" id="exportExcel">
                                            <i class="bi bi-file-earmark-excel"></i>
                                            Export to Excel
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item" href="#" id="exportCSV">
                                            <i class="bi bi-filetype-csv"></i>
                                            Export to CSV
                                        </a>
                                    </li>

                                </ul>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                    <tr>
                        <th>Customer Code</th>
                        <th>Customer Name</th>
                        <th>Type</th>
                        <th>Mobile</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody id="customerTableBody">
                    <tr>
                        <td colspan="7" class="text-center">
                            Loading customers...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <span id="paginationInfo" class="text-muted"></span>

                <div>
                    <button class="btn btn-outline-primary btn-sm"
                            id="previousPage">Previous</button>

                    <button class="btn btn-outline-primary btn-sm"
                            id="nextPage">Next</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'customers/js/customer.js' %}"></script>
</body>
</html>
