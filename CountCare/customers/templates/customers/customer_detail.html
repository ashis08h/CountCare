
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CashCount | Customer Profile</title>

    {% load static %}

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{% static 'customers/css/customer.css' %}">
</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Customer Profile</h2>
            <p class="text-muted mb-0">
                View and manage customer information
            </p>
        </div>

        <a href="/api/customer-management/"
           class="btn btn-outline-secondary">
            Back to Customers
        </a>

    </div>

    <div id="messageBox"></div>

    <!-- Customer Information -->

    <div class="card shadow-sm mb-4">

        <div class="card-header d-flex justify-content-between">

            <h5 class="mb-0">Customer Information</h5>

            <button class="btn btn-primary btn-sm"
                    id="editCustomerBtn">
                Edit Customer
            </button>

        </div>

        <div class="card-body">

            <form id="customerDetailForm">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Customer Code</label>
                        <input type="text" class="form-control"
                               id="customerCode" readonly>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Customer Type</label>
                        <select class="form-select"
                                id="customerType" disabled>
                            <option value="INDIVIDUAL">Individual</option>
                            <option value="BUSINESS">Business</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3"
                         id="businessNameGroup">

                        <label class="form-label">Business Name</label>

                        <input type="text" class="form-control"
                               id="businessName" disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Contact Person</label>
                        <input type="text" class="form-control"
                               id="contactPerson" disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" class="form-control"
                               id="mobileNumber" disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Alternate Mobile</label>
                        <input type="text" class="form-control"
                               id="alternateMobile" disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               id="email" disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">GST Number</label>
                        <input type="text" class="form-control"
                               id="gstNumber" disabled>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">PAN Number</label>
                        <input type="text" class="form-control"
                               id="panNumber" disabled>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control"
                                  id="notes" rows="2"
                                  disabled></textarea>
                    </div>

                </div>

                <div id="editButtons" style="display:none;">

                    <button type="submit"
                            class="btn btn-success"
                            id="updateCustomerBtn">
                        Save Changes
                    </button>

                    <button type="button"
                            class="btn btn-secondary"
                            id="cancelEditBtn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Customer Addresses -->

    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between">

            <h5 class="mb-0">Customer Addresses</h5>

            <button class="btn btn-primary btn-sm"
                    id="addAddressBtn">
                + Add Address
            </button>

        </div>

        <div class="card-body">

            <div id="addressContainer" class="row">

                <div class="col-12 text-center">
                    Loading addresses...
                </div>

            </div>

        </div>

    </div>

</div>


<!-- Add/Edit Address Modal -->

<div class="modal fade" id="addressModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="addressModalTitle">
                    Add Address
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="addressForm">

                    <input type="hidden" id="addressId">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Address Type *
                            </label>

                            <select class="form-select"
                                    id="addressType" required>

                                <option value="BILLING">Billing</option>
                                <option value="SHIPPING">Shipping</option>
                                <option value="OFFICE">Office</option>
                                <option value="HOME">Home</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Address Line 1 *
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="addressLine1" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Address Line 2
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="addressLine2">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">City *</label>

                            <input type="text"
                                   class="form-control"
                                   id="city" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">District</label>

                            <input type="text"
                                   class="form-control"
                                   id="district">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">State *</label>

                            <input type="text"
                                   class="form-control"
                                   id="state" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">PIN Code *</label>

                            <input type="text"
                                   class="form-control"
                                   id="pincode"
                                   maxlength="6" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Country</label>

                            <input type="text"
                                   class="form-control"
                                   id="country"
                                   value="India">

                        </div>

                        <div class="col-md-12 mb-3">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="isDefault">

                                <label class="form-check-label"
                                       for="isDefault">
                                    Set as default address
                                </label>

                            </div>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-success"
                            id="saveAddressBtn">
                        Save Address
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const CUSTOMER_ID = {{ customer_id }};
</script>

<script src="{% static 'customers/js/customer_detail.js' %}"></script>

</body>
</html>
