
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CashCount</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f3f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 35px rgba(0,0,0,.07);
        }

        .brand {
            color: #174ea6;
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-login {
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="brand">CashCount</div>

    <p class="subtitle">Sign in to your business account</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username or Email</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username or email"
                   value="{{ request.POST.username|default:'' }}"
                   autocomplete="username"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary btn-login w-100">
            Login
        </button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted">New to CashCount?</span>
        <a href="{% url 'register' %}" class="text-decoration-none">
            Register your company
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
